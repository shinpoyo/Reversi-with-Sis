<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ねーちゃんとオセロ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="comic-page" id="comicPage">

  <!-- Header: 1行コンパクト配置 -->
  <header class="comic-header">
    <div class="comic-title">
      <span class="chapter-badge">完全版</span>
      <span class="title-text">ねーちゃんとオセロ</span>
    </div>
    <div class="header-actions">
      <select class="stage-select" id="stageSelect" onchange="changeStage()">
        <option value="easy">【初級】おやつ前</option>
        <option value="normal" selected>【中級】放課後</option>
        <option value="hard">【上級】テスト前</option>
      </select>
      <button class="comic-btn-icon" id="soundBtn" onclick="toggleSound()" title="音量切替">🔊</button>
      <button class="comic-btn-icon" onclick="resetGame()" title="やり直す">🔄</button>
    </div>
  </header>

  <!-- Top Comic Panels: スマホでも横並び2分割で高さを大幅節約 -->
  <div class="top-panels">

    <!-- Panel 1: 姉ちゃんコマ -->
    <div class="panel panel-sister" id="panelSister">
      <div class="sister-content">
        <div class="sister-sprite face_happy" id="sisterSprite">
          <div class="mood-tag" id="moodTag">ご機嫌</div>
        </div>
        <div class="speech-balloon" id="speechBalloon">
          「手加減なしよ！コテンパンにしてあげる！」
        </div>
      </div>
      <div class="anger-wrapper">
        <div class="anger-header">
          <span>💢 SISTER'S ANGER</span>
          <span class="crisis-badge" id="crisisBadge">🔥劣勢中</span>
          <span id="angerText">20%</span>
        </div>
        <div class="anger-bar-box">
          <div class="anger-bar-progress" id="angerBar"></div>
        </div>
      </div>
    </div>

    <!-- Panel 2: 弟モノローグコマ -->
    <div class="panel panel-brother">
      <div class="brother-box">
        <div class="thought-title">💭 弟の心の声</div>
        <div class="thought-text" id="thoughtText">
          「勝つのは簡単だ……だが怒らせたら盤が飛ぶ。ギリギリの接戦を演出するんだ！」
        </div>
      </div>
      <div class="sound-effect-float" id="monoEffect">ドクン…</div>
    </div>

  </div>

  <!-- Score & Turn Banner -->
  <div class="banner-score">
    <div class="player-disc-count">
      <div class="mini-disc mini-black"></div>
      <span>弟: <b id="blackScore">2</b></span>
    </div>
    <div class="turn-tag" id="turnTag">あなたの番 (黒)</div>
    <div class="player-disc-count">
      <div class="mini-disc mini-white"></div>
      <span>姉: <b id="whiteScore">2</b></span>
    </div>
  </div>

  <!-- Hospitality Commands -->
  <div class="hospitality-bar">
    <button class="cmd-btn" id="btnTea" onclick="useCommand('tea')">
      <span>🍵 お茶を出す</span>
      <span class="cmd-sub">怒り-25% [残<b id="teaCount">2</b>]</span>
    </button>
    <button class="cmd-btn" id="btnPraise" onclick="useCommand('praise')">
      <span>👏 姉ちゃん褒める</span>
      <span class="cmd-sub">怒り-15% [残<b id="praiseCount">2</b>]</span>
    </button>
    <button class="cmd-btn" id="btnHesitate" onclick="useCommand('hesitate')">
      <span>🤔 悩むフリ</span>
      <span class="cmd-sub">怒り-8% [残<b id="hesitateCount">3</b>]</span>
    </button>
  </div>

  <!-- Move Preview Bar -->
  <div class="move-preview-bar" id="movePreviewBar">
    💡 マスをタッチすると返る枚数と怒り予測が表示されます
  </div>

  <!-- Main 8x8 Board: 画面高さに合わせて自動スケーリング -->
  <div class="board-area">
    <div class="board-container" id="boardContainer">
      <div class="othello-grid" id="othelloGrid">
        <!-- 64 cells generated by JS -->
      </div>
    </div>
  </div>

</div>

<!-- Mid-game Dynamic Anime Cut-in Banner -->
<div class="anime-cutin-banner" id="animeCutinBanner">
  <div class="sister-sprite face_furious cutin-banner-sprite" id="cutinBannerSprite"></div>
  <div class="cutin-banner-text" id="cutinBannerText">「そこ私の角だったのに！！」</div>
</div>

<!-- Manga Cut-in Result Modal -->
<div class="manga-modal-bg" id="mangaModal">
  <div class="manga-modal-box">
    <div class="speed-lines"></div>
    <div class="modal-shout" id="modalShout">ドォォォン！！</div>
    <div class="modal-illust-wrap" id="modalIllustWrap">
      <img id="modalSceneImg" class="modal-illust-scene" src="sister_table_flip_scene.jpg" alt="ちゃぶ台返し">
      <div id="modalFaceSprite" class="sister-sprite face_happy modal-face-sprite"></div>
    </div>
    <div class="modal-balloon" id="modalBalloon">「もうやんない！！！！」</div>
    <div class="modal-score" id="modalScore">結果</div>
    <div class="modal-desc" id="modalDesc">説明</div>
    <button class="modal-btn" onclick="closeModalAndReset()">もう一度挑戦する</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
